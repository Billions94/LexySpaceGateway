# fly.toml app configuration file generated for lexyspacegateway on 2024-03-26T18:51:19+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lexyspacegateway'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 3001
  protocol = 'http'
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
