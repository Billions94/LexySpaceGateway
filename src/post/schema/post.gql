type Query {
  posts: [Post!]!
  getPostById(postId: String): PostResponse!
}

type Mutation {
  addPost(input: PostInput, file: Upload): PostResponse!
  updatePost(postId: String, input: PostInput, file: Upload): PostResponse!
  addPostLike(postId: String): Boolean!
  deletePost(postId: String): Boolean!
}

type Subscription {
  newPost: Post
}

type PostResponse {
  id: ID
  status: Boolean
  post: Post
}

type Post {
  id: ID!
  content: String!
  media: String
  sharedPost: Post
  user: User!
  comments: [Comment]
  likes: [User]
  createdAt: Date
  updatedAt: Date
}

input PostInput {
  content: String!
  media: String
  sharedPost: String
}
